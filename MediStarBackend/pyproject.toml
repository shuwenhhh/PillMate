[project]
name = "pillmate-backend"
version = "0.1.0"
description = "Privacy-conscious FastAPI backend for PillMate's record summarizer"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.8.30",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "openai>=1.99,<2.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
